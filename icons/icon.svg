<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#3498db" stroke="#2980b9" stroke-width="4"/>
  
  <!-- Trash can icon -->
  <rect x="40" y="35" width="48" height="58" rx="4" fill="white"/>
  <rect x="45" y="40" width="38" height="48" rx="2" fill="#e74c3c"/>
  
  <!-- Trash can lid -->
  <rect x="35" y="30" width="58" height="12" rx="6" fill="white"/>
  <rect x="40" y="32" width="48" height="8" rx="4" fill="#e74c3c"/>
  
  <!-- Trash can handle -->
  <rect x="55" y="25" width="18" height="8" rx="4" fill="white"/>
  
  <!-- Delete lines -->
  <line x1="50" y1="55" x2="78" y2="55" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="65" x2="78" y2="65" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="75" x2="78" y2="75" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Element selection indicator -->
  <rect x="20" y="20" width="20" height="20" rx="2" fill="none" stroke="white" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="30" cy="30" r="3" fill="white"/>
</svg>
