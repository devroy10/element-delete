<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageSurgeon</title>
    <link rel="stylesheet" href="./styles/popup.css">
</head>

<body>
    <div class="popup">
        <header class="popup__header">
            <h1 class="popup__title">PageSurgeon</h1>
            <p class="popup__subtitle">Surgical page editing</p>
        </header>

        <main class="popup__main">
            <div class="popup__status">
                <span class="popup__status-label">Status:</span>
                <span class="popup__status-value" id="statusValue">Inactive</span>
            </div>

            <div class="popup__refresh-notice" id="refreshNotice" hidden>
                <p>⚠️ PageSurgeon couldn't connect to this page.</p>
                <p><a href="#" id="refreshLink">Refresh the page</a> and try again.</p>
            </div>

            <div class="popup__mode-selector">
                <label class="popup__mode-option">
                    <input type="radio" name="mode" value="delete" checked>
                    <span class="popup__mode-label">🗑️ Delete</span>
                </label>
                <label class="popup__mode-option">
                    <input type="radio" name="mode" value="edit">
                    <span class="popup__mode-label">✏️ Edit Text</span>
                </label>
                <label class="popup__mode-option">
                    <input type="radio" name="mode" value="screenshot">
                    <span class="popup__mode-label">📷 Screenshot</span>
                </label>
                <label class="popup__mode-option">
                    <input type="radio" name="mode" value="blur">
                    <span class="popup__mode-label">🔵 Blur</span>
                </label>
            </div>

            <div class="popup__actions">
                <button class="popup__button popup__button--primary" id="activateButton">
                    Activate Delete
                </button>
                <button class="popup__button popup__button--secondary" id="helpButton">
                    Help
                </button>
            </div>

            <div class="popup__info">
                <h3>How to use:</h3>
                <ol class="popup__steps" id="helpSteps">
                    <li>Select a mode above</li>
                    <li>Click "Activate" to start</li>
                    <li>Hover to highlight, click to act</li>
                    <li>Use side panel for more options</li>
                </ol>
            </div>
        </main>

        <footer class="popup__footer">
            <p class="popup__version">v0.2.0</p>
        </footer>
    </div>

    <script src="./scripts/popup.js"></script>
</body>

</html>
